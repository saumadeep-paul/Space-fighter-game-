<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Fighter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 900px;
            background: radial-gradient(circle at center, #0f0f2d 0%, #050510 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7);
        }
        .lives-container {
            display: flex;
            gap: 5px;
            font-size: 20px;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 28px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 8px;
            text-align: center;
        }
        #overlay p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
            text-align: center;
        }
        .char-selection {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }
        .char-card {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .char-card:hover, .char-card.selected {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }
        .char-card img {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            margin-bottom: 6px;
        }
        .char-card span {
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }
        .start-btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #0088ff);
            border: none;
            border-radius: 25px;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            transition: transform 0.1s;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

        };

        const charImages = {};
        for (let key in characters) {
            const img = new Image();
            img.src = characters[key];
            charImages[key] = img;
        }

        let selectedCharacter = 'Bijoy';

        // Select Character UI
        const charCards = document.querySelectorAll('.char-card');
        charCards.forEach(card => {
            card.addEventListener('click', () => {
                charCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedCharacter = card.getAttribute('data-char');
            });
        });

        // Sound Effects (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playShootSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Game State
        let gameState = 'START';
        let score = 0;
        let lives = 3;
        let frameCount = 0;

        // Touch & Drag Controls
        let isTouching = false;
        let targetX = width / 2;
        let targetY = height - 80;

        function updatePointerPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            targetX = clientX - rect.left;
            targetY = clientY - rect.top;
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            updatePointerPosition(e);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isTouching) updatePointerPosition(e);
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
        });

        canvas.addEventListener('mousedown', (e) => {
            isTouching = true;
            updatePointerPosition(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isTouching) updatePointerPosition(e);
        });

        canvas.addEventListener('mouseup', () => {
            isTouching = false;
        });

        // Keyboard Controls Backup
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, KeyW: false, KeyS: false, KeyA: false, KeyD: false, Space: false };
        window.addEventListener('keydown', e => { if (e.code in keys) keys[e.code] = true; });
        window.addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = false; });

        // Starfield
        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 2 + 1
        }));

        // Entities
        let player = { x: width / 2, y: height - 80, width: 36, height: 44, speed: 8, shootTimer: 0 };
        let playerBullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];

        function resetGame() {
            score = 0;
            lives = 3;
            player.x = width / 2;
            player.y = height - 80;
            targetX = width / 2;
            targetY = height - 80;
            playerBullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('score').innerText = `SCORE: ${score}`;
            document.getElementById('lives').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function createExplosion(x, y, color, count = 15) {
            playExplosionSound();
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color,
                    alpha: 1,
                    life: Math.random() * 20 + 20
                });
            }
        }

        // Main Loop
        function gameLoop() {
            ctx.clearRect(0, 0, width, height);

            // Stars Background
            ctx.fillStyle = '#fff';
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > height) { s.y = 0; s.x = Math.random() * width; }
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            if (gameState === 'PLAYING') {
                frameCount++;

                // Movement via Drag / Touch
                if (isTouching) {
                    player.x += (targetX - player.x) * 0.2;
                    player.y += (targetY - player.y) * 0.2;
                } else {
                    let moveX = 0, moveY = 0;
                    if (keys.ArrowLeft || keys.KeyA) moveX -= 1;
                    if (keys.ArrowRight || keys.KeyD) moveX += 1;
                    if (keys.ArrowUp || keys.KeyW) moveY -= 1;
                    if (keys.ArrowDown || keys.KeyS) moveY += 1;
                    player.x += moveX * player.speed;
                    player.y += moveY * player.speed;
                }

                player.x = Math.max(30, Math.min(width - 30, player.x));
                player.y = Math.max(30, Math.min(height - 40, player.y));

                // Automatic Firing on Tap / Touch / Space
                player.shootTimer--;
                if ((isTouching || keys.Space) && player.shootTimer <= 0) {
                    playerBullets.push({ x: player.x - 12, y: player.y - 20, speed: 9, width: 4, height: 10 });
                    playerBullets.push({ x: player.x + 12, y: player.y - 20, speed: 9, width: 4, height: 10 });
                    player.shootTimer = 10;
                    playShootSound();
                }

                // Spawn Enemies
                if (frameCount % 60 === 0) {
                    enemies.push({
                        x: Math.random() * (width - 40) + 20,
                        y: -30,
                        width: 30,
                        height: 30,
                        speed: Math.random() * 1.5 + 2,
                        shootTimer: Math.random() * 60 + 30
                    });
                }

                // Update Player Bullets
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    let b = playerBullets[i];
                    b.y -= b.speed;
                    if (b.y < -10) {
                        playerBullets.splice(i, 1);
                    }
                }

                // Update Enemy Bullets
                for (let j = enemyBullets.length - 1; j >= 0; j--) {
                    let eb = enemyBullets[j];
                    eb.y += eb.speed;
                    if (eb.y > height + 10) {
                        enemyBullets.splice(j, 1);
                        continue;
                    }

                    // Player Hit by Enemy Bullet
                    if (Math.hypot(eb.x - player.x, eb.y - player.y) < 22) {
                        enemyBullets.splice(j, 1);
                        handlePlayerHit();
                    }
                }

                // Bullet-to-Bullet Collision Detection
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    let pb = playerBullets[i];
                    if (!pb) continue;
                    for (let j = enemyBullets.length - 1; j >= 0; j--) {
                        let eb = enemyBullets[j];
                        if (!eb) continue;

                        if (Math.hypot(pb.x - eb.x, pb.y - eb.y) < 12) {
                            createExplosion((pb.x + eb.x) / 2, (pb.y + eb.y) / 2, '#ffff00', 8);
                            playerBullets.splice(i, 1);
                            enemyBullets.splice(j, 1);
                            break;
                        }
                    }
                }

                // Update Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;
                    e.shootTimer--;
                    if (e.shootTimer <= 0) {
                        enemyBullets.push({ x: e.x, y: e.y + 15, speed: 5 });
                        e.shootTimer = Math.random() * 90 + 60;
                    }

                    // Bullet Hit Enemy
                    for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
                        let b = playerBullets[bi];
                        if (Math.hypot(b.x - e.x, b.y - e.y) < 22) {
                            createExplosion(e.x, e.y, '#ff5500');
                            enemies.splice(i, 1);
                            playerBullets.splice(bi, 1);
                            score += 100;
                            updateHUD();
                            break;
                        }
                    }

                    // Player Hit Enemy
                    if (enemies[i] && Math.hypot(e.x - player.x, e.y - player.y) < 28) {
                        createExplosion(e.x, e.y, '#ff5500');
                        enemies.splice(i, 1);
                        handlePlayerHit();
                    }

                    if (enemies[i] && e.y > height + 40) enemies.splice(i, 1);
                }

                // Draw Player Jet
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(0, -22);
                ctx.lineTo(18, 18);
                ctx.lineTo(6, 12);
                ctx.lineTo(0, 20);
                ctx.lineTo(-6, 12);
                ctx.lineTo(-18, 18);
                ctx.closePath();
                ctx.fill();
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();

                // Draw Character Picture Beside Plane
                const charImg = charImages[selectedCharacter];
                if (charImg && charImg.complete) {
                    const avatarRadius = 14;
                    const avatarX = player.x + 28;
                    const avatarY = player.y;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(avatarX, avatarY, avatarRadius, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(charImg, avatarX - avatarRadius, avatarY - avatarRadius, avatarRadius * 2, avatarRadius * 2);
                    ctx.restore();

                    // Avatar Border Glow
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(avatarX, avatarY, avatarRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 5;
                    ctx.stroke();
                    ctx.restore();
                }

                // Draw Enemy Spacecraft
                enemies.forEach(e => {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.moveTo(0, 18);
                    ctx.lineTo(-15, -12);
                    ctx.lineTo(0, -5);
                    ctx.lineTo(15, -12);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.restore();
                });

                // Draw Player Bullets
                ctx.fillStyle = '#ffff00';
                playerBullets.forEach(b => {
                    ctx.fillRect(b.x - 2, b.y, 4, 10);
                });

                // Draw Enemy Bullets
                ctx.fillStyle = '#ff3300';
                enemyBullets.forEach(eb => {
                    ctx.beginPath();
                    ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Update & Draw Particles
                particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 1 / p.life;
                    if (p.alpha <= 0) particles.splice(i, 1);
                    else {
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                        ctx.restore();
                    }
                });
            }

            requestAnimationFrame(gameLoop);
        }

        function handlePlayerHit() {
            createExplosion(player.x, player.y, '#00ffff', 25);
            lives--;
            updateHUD();
            if (lives <= 0) {
                gameState = 'GAMEOVER';
                document.getElementById('overlay-title').innerText = 'GAME OVER';
                document.getElementById('overlay-desc').innerText = `Final Score: ${score}`;
                document.getElementById('start-btn').innerText = 'PLAY AGAIN';
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            initAudio();
            resetGame();
            gameState = 'PLAYING';
            document.getElementById('overlay').style.display = 'none';
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
